<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975 200" width="487" height="100">
  <!-- Groovelet logo: the record mark and the word Groovelet.
       The word is near-black, so this file is for a light background.
       logo.svg has the same art with an off-white word.
       The letters are geometric strokes. They do not depend on a font. -->
  <g transform="translate(0 0) scale(1)">
    <g transform="scale(0.39)">
      <!-- The disc. A thin rim keeps the edge visible on a dark background. -->
      <circle cx="256" cy="256" r="236" fill="#151515"/>
      <circle cx="256" cy="256" r="234" fill="none" stroke="#3A3A3A" stroke-width="4"/>
      <!-- The grooves. Three outer lines and two inner lines. -->
      <circle cx="256" cy="256" r="192" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
      <circle cx="256" cy="256" r="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
      <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
      <circle cx="256" cy="256" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
      <circle cx="256" cy="256" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
      <!-- The coral groove. It reads as the G of Groovelet. -->
      <path d="M368.21 154.96 A151 151 0 1 0 407 256 H300" fill="none" stroke="#FF6B4A" stroke-width="48" stroke-linecap="butt" stroke-linejoin="miter"/>
      <!-- The spindle hole. -->
      <circle cx="256" cy="256" r="18" fill="#F5F1EC"/>
    </g>
    <!-- The word Groovelet as geometric strokes. -->
    <g transform="translate(236 149) scale(0.72)">
      <path d="M116.08 -116.08 A68 68 0 1 0 136 -68 H70 M180 0 V-100 M180 -55 A45 45 0 0 1 225 -100 M264 -50 A50 50 0 1 1 364 -50 A50 50 0 1 1 264 -50 M396 -50 A50 50 0 1 1 496 -50 A50 50 0 1 1 396 -50 M534 -100 L579 0 L624 -100 M662 -50 H762 A50 50 0 1 0 750.3 -17.86 M800 0 V-136 M838 -50 H938 A50 50 0 1 0 926.3 -17.86 M994 -130 V-30 A30 30 0 0 0 1024 0 M976 -100 H1026" fill="none" stroke="#111111" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter"/>
    </g>
  </g>
</svg>
