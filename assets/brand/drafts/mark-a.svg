<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Groovelet mark, draft A. A record seen from the front with a coral label.
       The background is transparent. -->
  <circle cx="256" cy="256" r="236" fill="#151515"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="#3A3A3A" stroke-width="4"/>
  <!-- The grooves, in two bands. -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
  <!-- The coral label and the spindle hole. -->
  <circle cx="256" cy="256" r="98" fill="#FF6B4A"/>
  <circle cx="256" cy="256" r="18" fill="#151515"/>
</svg>
