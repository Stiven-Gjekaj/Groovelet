<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 180" width="756" height="180" role="img" aria-label="Groovelet">
  <title>Groovelet</title>

  <defs>
    <!-- Warm amber through coral and rose to pink. The shift runs along
         the word, like a groove that spirals in. -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.4" stop-color="#ff6b4a"/>
      <stop offset="0.72" stop-color="#fb7a86"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- One scanline, tiled. A rule drawn per line would be a hundred
         elements that all say the same thing. -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <!-- The panel is near black, so it reads on the light and on the dark
       GitHub theme. The border is coral at a low opacity. -->
  <rect width="756" height="180" rx="16" fill="#111111"/>
  <rect x="6" y="6" width="744" height="168" rx="11"
        fill="none" stroke="#ff6b4a" stroke-opacity="0.28" stroke-width="2"/>

  <g filter="url(#glow)">
    <!-- A pixel record. The disc is dark, two rings are the grooves,
         the coral ring with a bar is the G groove of mark.svg, and the
         off-white pixel is the spindle hole. -->
    <g transform="translate(38 37)">
      <path d="M35 0h35v7h-35zM21 7h63v7h-63zM14 14h28v7h-28zM63 14h28v7h-28zM7 21h21v7h-21zM70 21h28v7h-28zM7 28h14v7h-14zM42 28h56v7h-56zM0 35h21v7h-21zM35 35h70v7h-70zM0 42h14v7h-14zM28 42h77v7h-77zM0 49h14v7h-14zM28 49h28v7h-28zM91 49h14v7h-14zM0 56h14v7h-14zM28 56h49v7h-49zM91 56h14v7h-14zM0 63h21v7h-21zM35 63h35v7h-35zM84 63h21v7h-21zM7 70h14v7h-14zM42 70h21v7h-21zM84 70h14v7h-14zM7 77h21v7h-21zM77 77h21v7h-21zM14 84h28v7h-28zM63 84h28v7h-28zM21 91h63v7h-63zM35 98h35v7h-35z" fill="#2a2a2a"/>
      <path d="M35 0h35v7h-35zM21 7h21v7h-21zM63 7h21v7h-21zM14 14h14v7h-14zM77 14h14v7h-14zM7 21h14v7h-14zM84 21h14v7h-14zM7 28h7v7h-7zM91 28h7v7h-7zM0 35h14v7h-14zM42 35h21v7h-21zM91 35h14v7h-14zM0 42h7v7h-7zM35 42h7v7h-7zM63 42h7v7h-7zM98 42h7v7h-7zM0 49h7v7h-7zM35 49h7v7h-7zM98 49h7v7h-7zM0 56h7v7h-7zM35 56h7v7h-7zM63 56h7v7h-7zM98 56h7v7h-7zM0 63h14v7h-14zM42 63h21v7h-21zM91 63h14v7h-14zM7 70h7v7h-7zM91 70h7v7h-7zM7 77h14v7h-14zM84 77h14v7h-14zM14 84h14v7h-14zM77 84h14v7h-14zM21 91h21v7h-21zM63 91h21v7h-21zM35 98h35v7h-35z" fill="#3a3a3a"/>
      <path d="M42 14h21v7h-21zM28 21h42v7h-42zM21 28h21v7h-21zM21 35h14v7h-14zM14 42h14v7h-14zM14 49h14v7h-14zM56 49h35v7h-35zM14 56h14v7h-14zM77 56h14v7h-14zM21 63h14v7h-14zM70 63h14v7h-14zM21 70h21v7h-21zM63 70h21v7h-21zM28 77h49v7h-49zM42 84h21v7h-21z" fill="#ff6b4a" opacity="0.95"/>
      <path d="M49 49h7v7h-7z" fill="#f5f1ec"/>
    </g>
    <!-- The word is a set of pixel paths, not text. GitHub strips external
         fonts, so a path renders the same everywhere. -->
    <path d="M9 0h27v9h-27zM324 0h9v9h-9zM0 9h9v9h-9zM36 9h9v9h-9zM324 9h9v9h-9zM432 9h9v9h-9zM0 18h9v9h-9zM54 18h9v9h-9zM72 18h18v9h-18zM117 18h27v9h-27zM171 18h27v9h-27zM216 18h9v9h-9zM252 18h9v9h-9zM279 18h27v9h-27zM324 18h9v9h-9zM369 18h27v9h-27zM423 18h27v9h-27zM0 27h9v9h-9zM18 27h27v9h-27zM54 27h18v9h-18zM90 27h9v9h-9zM108 27h9v9h-9zM144 27h9v9h-9zM162 27h9v9h-9zM198 27h9v9h-9zM216 27h9v9h-9zM252 27h9v9h-9zM270 27h9v9h-9zM306 27h9v9h-9zM324 27h9v9h-9zM360 27h9v9h-9zM396 27h9v9h-9zM432 27h9v9h-9zM0 36h9v9h-9zM36 36h9v9h-9zM54 36h9v9h-9zM108 36h9v9h-9zM144 36h9v9h-9zM162 36h9v9h-9zM198 36h9v9h-9zM216 36h9v9h-9zM252 36h9v9h-9zM270 36h45v9h-45zM324 36h9v9h-9zM360 36h45v9h-45zM432 36h9v9h-9zM0 45h9v9h-9zM36 45h9v9h-9zM54 45h9v9h-9zM108 45h9v9h-9zM144 45h9v9h-9zM162 45h9v9h-9zM198 45h9v9h-9zM225 45h9v9h-9zM243 45h9v9h-9zM270 45h9v9h-9zM324 45h9v9h-9zM360 45h9v9h-9zM432 45h9v9h-9zM9 54h27v9h-27zM54 54h9v9h-9zM117 54h27v9h-27zM171 54h27v9h-27zM234 54h9v9h-9zM279 54h36v9h-36zM324 54h18v9h-18zM369 54h36v9h-36zM432 54h27v9h-27z" fill="url(#ink)" transform="translate(170 58)"/>
    <!-- Five sound bars. They move where SVG animation runs. Elsewhere,
         the first value is a still bar chart. -->
    <g fill="#f472b6" opacity="0.85">
      <rect x="650" y="72" width="10" height="36">
        <animate attributeName="y" values="72;60;84;72" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="height" values="36;60;12;36" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="666" y="60" width="10" height="60">
        <animate attributeName="y" values="60;78;54;60" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="60;24;72;60" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="682" y="48" width="10" height="84">
        <animate attributeName="y" values="48;66;48" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="height" values="84;48;84" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="698" y="66" width="10" height="48">
        <animate attributeName="y" values="66;54;80;66" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="height" values="48;72;20;48" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="714" y="78" width="10" height="24">
        <animate attributeName="y" values="78;64;84;78" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="24;52;12;24" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect width="756" height="180" rx="16" fill="url(#scanlines)"
        opacity="0.5" pointer-events="none"/>
</svg>
