<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Groovelet">
  <title>Groovelet</title>
  <!-- Groovelet GitHub social preview, 1280x640, in the pixel style of
       wordmark.svg. The content stays inside the middle area
       (x 198..1130, y 180..480), because GitHub crops the edges in some places. -->

  <defs>
    <!-- Warm amber through coral and rose to pink. The shift runs along
         the word, like a groove that spirals in. -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.4" stop-color="#ff6b4a"/>
      <stop offset="0.72" stop-color="#fb7a86"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- One scanline, tiled. A rule drawn per line would be a hundred
         elements that all say the same thing. -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <radialGradient id="pool" cx="640" cy="300" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#111111"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#111111"/>
  <rect width="1280" height="640" fill="url(#pool)"/>
  <!-- A thin coral border, inset like the border of the wordmark. -->
  <rect x="16" y="16" width="1248" height="608" rx="20"
        fill="none" stroke="#ff6b4a" stroke-opacity="0.28" stroke-width="3"/>

  <g filter="url(#glow)">
    <!-- A pixel record. The disc is dark, two rings are the grooves,
         the coral ring with a bar is the G groove of mark.svg, and the
         off-white pixel is the spindle hole. -->
    <g transform="translate(202 196)">
      <path d="M55 0h55v11h-55zM33 11h99v11h-99zM22 22h44v11h-44zM99 22h44v11h-44zM11 33h33v11h-33zM110 33h44v11h-44zM11 44h22v11h-22zM66 44h88v11h-88zM0 55h33v11h-33zM55 55h110v11h-110zM0 66h22v11h-22zM44 66h121v11h-121zM0 77h22v11h-22zM44 77h44v11h-44zM143 77h22v11h-22zM0 88h22v11h-22zM44 88h77v11h-77zM143 88h22v11h-22zM0 99h33v11h-33zM55 99h55v11h-55zM132 99h33v11h-33zM11 110h22v11h-22zM66 110h33v11h-33zM132 110h22v11h-22zM11 121h33v11h-33zM121 121h33v11h-33zM22 132h44v11h-44zM99 132h44v11h-44zM33 143h99v11h-99zM55 154h55v11h-55z" fill="#2a2a2a"/>
      <path d="M55 0h55v11h-55zM33 11h33v11h-33zM99 11h33v11h-33zM22 22h22v11h-22zM121 22h22v11h-22zM11 33h22v11h-22zM132 33h22v11h-22zM11 44h11v11h-11zM143 44h11v11h-11zM0 55h22v11h-22zM66 55h33v11h-33zM143 55h22v11h-22zM0 66h11v11h-11zM55 66h11v11h-11zM99 66h11v11h-11zM154 66h11v11h-11zM0 77h11v11h-11zM55 77h11v11h-11zM154 77h11v11h-11zM0 88h11v11h-11zM55 88h11v11h-11zM99 88h11v11h-11zM154 88h11v11h-11zM0 99h22v11h-22zM66 99h33v11h-33zM143 99h22v11h-22zM11 110h11v11h-11zM143 110h11v11h-11zM11 121h22v11h-22zM132 121h22v11h-22zM22 132h22v11h-22zM121 132h22v11h-22zM33 143h33v11h-33zM99 143h33v11h-33zM55 154h55v11h-55z" fill="#3a3a3a"/>
