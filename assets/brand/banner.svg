  <!-- The mark, 240 pixels, at the left. -->
  <g transform="translate(198 180) scale(0.47)">
    <!-- The disc. A thin rim keeps the edge visible on a dark background. -->
    <circle cx="256" cy="256" r="236" fill="#151515"/>
    <circle cx="256" cy="256" r="234" fill="none" stroke="#3A3A3A" stroke-width="4"/>
    <!-- The grooves. Three outer lines and two inner lines. -->
