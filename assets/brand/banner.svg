<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Groovelet GitHub social preview, 1280x640.
       The content stays inside the middle area (x 198..1130, y 180..480),
       because GitHub crops the edges in some places.
       The letters are geometric strokes. They do not depend on a font. -->
  <defs>
    <radialGradient id="bglow" cx="640" cy="320" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="lift" cx="318" cy="300" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C3C3C"/>
      <stop offset="0.6" stop-color="#3C3C3C" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3C3C3C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#000000"/>
  <rect width="1280" height="640" fill="url(#bglow)"/>
  <!-- A soft light behind the mark, so the disc shows on the black. -->
  <circle cx="318" cy="300" r="200" fill="url(#lift)"/>
  <!-- Faint grooves over the whole banner, centred on the mark. -->
  <circle cx="318" cy="300" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
