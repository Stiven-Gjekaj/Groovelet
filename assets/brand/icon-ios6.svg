<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The icon as iOS 6 shows it. An app in /Applications is a system app,
       so iOS 6 does not round its corners or add the gloss. This file holds
       the same art as icon.svg and adds both. The corner radius is 10 of 57
       pixels, the same as the mask of iOS 6. -->
  <defs>
    <radialGradient id="table" cx="256" cy="256" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#202020"/>
    </radialGradient>
      <clipPath id="corners">
      <rect width="512" height="512" rx="90" ry="90"/>
    </clipPath>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#corners)">
    <rect width="512" height="512" fill="#111111"/>
    <rect width="512" height="512" fill="url(#table)"/>
    <!-- The disc. A thin rim keeps the edge visible on a dark background. -->
    <circle cx="256" cy="256" r="236" fill="#151515"/>
    <circle cx="256" cy="256" r="234" fill="none" stroke="#3A3A3A" stroke-width="4"/>
    <!-- The grooves. Three outer lines and two inner lines. -->
    <circle cx="256" cy="256" r="192" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
    <circle cx="256" cy="256" r="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
    <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
    <circle cx="256" cy="256" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/>
    <!-- The coral groove. It reads as the G of Groovelet. -->
    <path d="M368.21 154.96 A151 151 0 1 0 407 256 H300" fill="none" stroke="#FF6B4A" stroke-width="48" stroke-linecap="butt" stroke-linejoin="miter"/>
    <!-- The spindle hole. -->
    <circle cx="256" cy="256" r="18" fill="#F5F1EC"/>
    <!-- The gloss: a light area over the top half, with a curved lower edge. -->
    <path d="M0 0 H512 V236 C400 270 112 270 0 236 Z" fill="url(#gloss)"/>
  </g>
</svg>
