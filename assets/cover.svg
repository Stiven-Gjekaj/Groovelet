<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Groovelet cover art for a track with no album art.
       A dark record with a short coral groove. It has no text,
       so it reads at 44 pixels and at 300 pixels, and it works
       under a blurred and darkened copy. -->
  <defs>
    <radialGradient id="base" cx="300" cy="300" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#121212"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="#111111"/>
  <rect width="600" height="600" fill="url(#base)"/>
  <!-- The record. It is larger than the square, so the edge is cut. -->
  <circle cx="300" cy="300" r="262" fill="#151515"/>
  <circle cx="300" cy="300" r="260" fill="none" stroke="#333333" stroke-width="4"/>
  <!-- The grooves. -->
  <circle cx="300" cy="300" r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="136" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="152" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <circle cx="300" cy="300" r="248" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
  <!-- A short coral groove. It is the only accent. -->
  <path d="M332.99 112.89 A190 190 0 0 1 488.15 273.56" fill="none" stroke="#FF6B4A" stroke-width="16" stroke-linecap="round"/>
  <!-- The label and the spindle hole. -->
  <circle cx="300" cy="300" r="72" fill="#1E1E1E"/>
  <circle cx="300" cy="300" r="70" fill="none" stroke="#3A3A3A" stroke-width="3"/>
  <circle cx="300" cy="300" r="14" fill="#F5F1EC"/>
</svg>
